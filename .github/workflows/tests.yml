name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run project 1 tests
        working-directory: project1_workflow
        run: python -m unittest discover -s tests -q
      - name: Run project 2 tests
        working-directory: project2_quality_dashboard
        run: python -m unittest discover -s tests -q
      - name: Run project 3 tests and evaluation
        working-directory: project3_report_assistant
        run: |
          python -m unittest discover -s tests -q
          python evaluate.py
